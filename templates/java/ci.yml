# ──────────────────────────────────────────────────────────────────────────────
# Java CI/CD Template (Maven)
# Stages: Lint → Test → Security Scan → Build → Deploy (GHCR + VPS SSH)
#
# Assumes Maven (a Gradle build works the same shape — swap the `mvn ...`
# run: commands below for the equivalent `./gradlew ...` ones). Uses direct
# plugin-goal invocation (`mvn <prefix>:<goal>`) throughout so lint/coverage/
# security scanning work out of the box without requiring these plugins to
# already be declared in pom.xml — same "works with a stock project" spirit
# as `ruff check .` or `golangci-lint` needing no repo-side config either.
#
# Required secrets:
#   GHCR_TOKEN       — GitHub token with packages:write scope
#   VPS_HOST         — SSH host (IP or domain)
#   VPS_USER         — SSH user
#   VPS_SSH_KEY      — Private SSH key (base64 or raw PEM)
#   VPS_PORT         — SSH port (default 22)
#   FLY_API_TOKEN    — Only if deploy_target is 'fly' (flyctl auth token)
#   KUBE_CONFIG      — Only if deploy_target is 'k8s' (base64-encoded kubeconfig)
#   AWS_ACCESS_KEY_ID     — Only if deploy_target is 'ecs'
#   AWS_SECRET_ACCESS_KEY — Only if deploy_target is 'ecs'
#
# Required variables (repo Settings → Variables):
#   APP_NAME         — Used for Docker image name and systemd service
#   DEPLOY_PATH      — Path on VPS where docker-compose.yml lives
#   KUBE_NAMESPACE   — Kubernetes namespace (default: default)
#   AWS_REGION       — AWS region for ECS
#   ECS_CLUSTER      — ECS cluster name (required, no default)
#   ECS_SERVICE      — ECS service name (default: same as APP_NAME)
#
# Deploying to Fly.io requires a fly.toml in the repo root (run `fly launch`
# once locally to generate it) — the deploy-fly job below doesn't create one.
# Deploying to Kubernetes assumes a Deployment already exists in the cluster
# with a container name matching APP_NAME — deploy-k8s only rolls out a new
# image (`kubectl set image`), it doesn't apply manifests or create resources.
# Deploying to AWS ECS assumes an ECS service + task definition family
# already exist (family/container name matching APP_NAME) — deploy-ecs only
# registers a new task definition revision with the new image and updates
# the service, it doesn't create the cluster/service/task definition.
# ──────────────────────────────────────────────────────────────────────────────

name: Java CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target"
        required: false
        default: "ghcr"
        type: choice
        options: [ghcr, vps, fly, k8s, ecs, both, none]

# Least-privilege default — actions/checkout only needs read access here.
# Jobs that need more (e.g. commenting on a PR) declare it themselves below.
permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  IMAGE_NAME: ${{ vars.APP_NAME || 'app' }}
  REGISTRY: ghcr.io

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    timeout-minutes: 10
    name: Lint (java${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add more entries to test against multiple Java releases, e.g.:
        # java-version: ["21", "25"]
        java-version: ["25"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Checkstyle
        # Uses Sun's default ruleset unless pom.xml configures maven-checkstyle-plugin
        # with its own <configLocation>.
        run: mvn -B checkstyle:check

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    timeout-minutes: 20
    name: Test (java${{ matrix.java-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        java-version: ["25"]   # keep in sync with the lint job's matrix above
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Run tests with JaCoCo coverage
        run: mvn -B org.jacoco:jacoco-maven-plugin:prepare-agent test org.jacoco:jacoco-maven-plugin:report
        env:
          ENVIRONMENT: test
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=70
          COVERAGE=$(python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("target/site/jacoco/jacoco.xml").getroot()
          counter = [c for c in root.findall("counter") if c.get("type") == "LINE"][0]
          covered, missed = int(counter.get("covered")), int(counter.get("missed"))
          print(round(100 * covered / (covered + missed), 1))
          PYEOF
          )
          echo "Total line coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" -v thr="$THRESHOLD" 'BEGIN { exit (cov+0 < thr+0) }' || {
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          }
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-java${{ matrix.java-version }}
          path: target/site/jacoco/
          retention-days: 7

  # ── Security Scan ───────────────────────────────────────────────────────────
  security:
    timeout-minutes: 15
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Audit dependencies (OWASP Dependency-Check)
        run: mvn -B org.owasp:dependency-check-maven:check
      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 7

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    timeout-minutes: 30
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      id-token: write     # needed for cosign's keyless OIDC signing + SLSA attestation below
      attestations: write # needed to publish the SLSA provenance attestation below
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_full: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SBOM + signing — skipped on PR builds, which don't push an image ──────
      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image (keyless, via GitHub OIDC)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
      - name: Generate SLSA provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ── Deploy → VPS ────────────────────────────────────────────────────────────
  deploy-vps:
    timeout-minutes: 15
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event.inputs.deploy_target == 'vps' || github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == '')
    environment:
      name: production
      # jobs.<job_id>.environment.url does NOT have the secrets context
      # available (confirmed against GitHub's own Contexts reference —
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
      # — env, vars, steps, and needs ARE listed there, secrets is not),
      # so this can't reference ${{ secrets.VPS_HOST }} directly.
      # steps IS allowed here, so a step's own output (computed in a
      # context where secrets IS available, like steps.run/steps.env)
      # is the correct, documented way to set a dynamic environment URL.
      url: https://${{ steps.env_url.outputs.host }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Compute environment URL
        id: env_url
        run: echo "host=${{ secrets.VPS_HOST }}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ needs.build.outputs.image_full }}
            docker compose up -d --no-build
            docker system prune -f

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for application health check..."
          MAX_WAIT=60
          ELAPSED=0
          until curl -sf "https://${{ secrets.VPS_HOST }}/health" > /dev/null 2>&1; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Health check timed out after ${MAX_WAIT}s — rolling back"
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "  Waited ${ELAPSED}s..."
          done
          echo "Application is healthy!"

  # ── Deploy → Fly.io ──────────────────────────────────────────────────────────
  deploy-fly:
    timeout-minutes: 15
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Depends on `build` for gating (only deploy once lint/test/security/build
    # all pass) — Fly.io builds its own image from the Dockerfile via its
    # remote builder rather than reusing the one `build` pushed to GHCR, since
    # Fly.io has no clean native way to pull a private GHCR image at deploy time.
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.inputs.deploy_target == 'fly'
    environment:
      name: production
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Deploy → Kubernetes ──────────────────────────────────────────────────────
  deploy-k8s:
    timeout-minutes: 15
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.inputs.deploy_target == 'k8s'
    environment:
      name: production
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Roll out new image
        env:
          DEPLOYMENT: ${{ env.IMAGE_NAME }}
          NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'default' }}
          IMAGE: ${{ needs.build.outputs.image_full }}
        run: |
          kubectl set image "deployment/$DEPLOYMENT" "$DEPLOYMENT=$IMAGE" -n "$NAMESPACE"
          kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s
      - name: Clean up kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"

  # ── Deploy → AWS ECS ─────────────────────────────────────────────────────────
  deploy-ecs:
    timeout-minutes: 15
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.inputs.deploy_target == 'ecs'
    environment:
      name: production
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Download current task definition
        env:
          FAMILY: ${{ env.IMAGE_NAME }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json
      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: ${{ env.IMAGE_NAME }}
          image: ${{ needs.build.outputs.image_full }}
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE || env.IMAGE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
