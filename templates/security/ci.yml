# ──────────────────────────────────────────────────────────────────────────────
# Security Audit Pipeline Template
# Standalone security pipeline — runs on schedule or on demand.
# Can be added to any repo alongside an existing CI pipeline.
#
# Covers: Secrets scan · Dependency audit · SAST · Container scan · SBOM
#
# No required secrets for basic usage.
# Optional:
#   GHCR_TOKEN       — Required only for container scan step
#   SLACK_WEBHOOK    — For Slack notifications on findings
# ──────────────────────────────────────────────────────────────────────────────

name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to report"
        required: false
        default: "HIGH"
        type: choice
        options: [LOW, MEDIUM, HIGH, CRITICAL]

# Least-privilege default — actions/checkout only needs read access here.
# Jobs that need more (e.g. commenting on a PR) declare it themselves below.
permissions:
  contents: read

env:
  SEVERITY: ${{ github.event.inputs.severity || 'HIGH' }}

jobs:
  # ── Secrets Scan ─────────────────────────────────────────────────────────────
  secrets:
    timeout-minutes: 15
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # Full history for Gitleaks
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Dependency Audit (Python) ─────────────────────────────────────────────────
  audit-python:
    timeout-minutes: 15
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Check for requirements file
        id: check
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit Python dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json -o pip-audit.json || \
          pip-audit --format=json -o pip-audit.json || true
          pip-audit -r requirements.txt || pip-audit
      - name: Upload audit report
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

  # ── Dependency Audit (Node.js) ───────────────────────────────────────────────
  audit-node:
    timeout-minutes: 15
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for package.json
        id: check
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.check.outputs.found == 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Audit Node.js dependencies
        if: steps.check.outputs.found == 'true'
        run: |
          npm ci
          npm audit --audit-level=high --json > npm-audit.json || true
          npm audit --audit-level=high
      - name: Upload audit report
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 30

  # ── SAST ─────────────────────────────────────────────────────────────────────
  sast:
    timeout-minutes: 20
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/python
            p/javascript
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  # ── Filesystem Vulnerability Scan ─────────────────────────────────────────────
  trivy-fs:
    timeout-minutes: 15
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy on filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: ${{ env.SEVERITY }},CRITICAL
          exit-code: "0"
      - name: Upload Trivy FS results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-fs-report
          path: trivy-fs-results.sarif
          retention-days: 30

  # ── Container Scan ────────────────────────────────────────────────────────────
  trivy-image:
    timeout-minutes: 20
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: security-scan:latest
          cache-from: type=gha
        continue-on-error: true
      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: security-scan:latest
          format: sarif
          output: trivy-image-results.sarif
          severity: ${{ env.SEVERITY }},CRITICAL
          exit-code: "0"
          vuln-type: os,library
        continue-on-error: true
      - name: Upload container scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-image-report
          path: trivy-image-results.sarif
          retention-days: 30

  # ── SBOM Generation ────────────────────────────────────────────────────────────
  sbom:
    timeout-minutes: 10
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # ── Notify ────────────────────────────────────────────────────────────────────
  notify:
    timeout-minutes: 5
    name: Notify
    runs-on: ubuntu-latest
    needs: [secrets, audit-python, audit-node, sast, trivy-fs, sbom]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Notify Slack on failure
        # secrets context isn't supported directly in if: conditions at
        # all ("Secrets can't be directly referenced in if: conditionals",
        # per GitHub's own docs) -- confirmed by actionlint flagging this
        # exact line, and matching the identical anti-pattern already
        # found and fixed in the sibling infra-as-code repo. env: CAN
        # reference secrets.*, and if: can then check env.* instead.
        if: contains(needs.*.result, 'failure') && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: *Security Audit Failed* on `${{ github.repository }}`",
              "attachments": [{
                "color": "danger",
                "fields": [{
                  "title": "Run",
                  "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "short": false
                }]
              }]
            }
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
