# ──────────────────────────────────────────────────────────────────────────────
# Python Package CI — REUSABLE (workflow_call) version
#
# For installable Python CLI/library packages (built as a wheel + sdist,
# published or installed directly — no Dockerfile, no registry push, no VPS
# deploy). This is deliberately a DIFFERENT shape from python-ci-reusable.yml
# in this same repo: that one builds a Docker image, pushes it to GHCR, signs
# it with cosign, and deploys it to a VPS — exactly right for a deployed web
# service (e.g. fastapi-boilerplate), but a fundamental mismatch for a CLI
# tool that's never containerized or deployed anywhere at all. Confirmed this
# mismatch directly (not assumed) before writing this file: python-ci-reusable
# and generic-ci-reusable both hardcode a "Build Docker image" job with no way
# to opt out of it.
#
# This workflow intentionally covers ONLY the genuinely identical part across
# a whole portfolio of CLI packages: lint, then build the wheel/sdist, verify
# the metadata, and install the built wheel into a clean venv as a smoke test.
# It deliberately does NOT run the package's own test suite or any bespoke
# integration testing (mock servers, live clusters, synthetic captures, etc.)
# — those are usually the most valuable, most carefully-built part of a given
# repo's CI, are different in kind from one repo to the next, and don't
# meaningfully generalize into a shared template without losing what makes
# them useful. Keep those in the CALLING repo's own workflow, running
# alongside this one, not inside it.
#
# Usage from a consuming repo's own workflow:
#
#   permissions:
#     contents: read
#
#   jobs:
#     package-ci:
#       uses: quaresma870/cicd-templates/.github/workflows/python-package-ci-reusable.yml@main
#       with:
#         python_version: "3.11"
#         cli_command: voipaudit
#         package_extras: "[pcap]"   # optional — omit or leave empty if the package has none
#
#     # Then, in the SAME workflow file, add your own jobs for the real test
#     # suite and any bespoke integration testing — see the sibling repos in
#     # this portfolio (voipaudit, camara-audit, certwatch, sbom-audit,
#     # netwatch, netpol-audit, etc.) for real, working examples of what that
#     # looks like. This reusable workflow replaces only their existing
#     # "Lint" and "Build package" jobs' shared boilerplate, not the rest.
#
# NOTE on file location: GitHub Actions requires reusable workflows to live
# directly in .github/workflows/ — subdirectories aren't supported, matching
# the same constraint already documented in python-ci-reusable.yml.
# ──────────────────────────────────────────────────────────────────────────────

name: Python Package CI (reusable)

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version for lint, build, and the smoke-install check"
        type: string
        default: "3.11"
      cli_command:
        description: "The installed CLI's entry-point command, used for the --version/--help smoke test (e.g. 'voipaudit')"
        type: string
        required: true
      package_extras:
        description: "Optional extras to install alongside the built wheel, e.g. '[pcap]' — leave empty if the package has none"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    timeout-minutes: 10
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - run: pip install ruff
      - run: ruff check .

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    timeout-minutes: 10
    name: Build package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
      - run: pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Install built wheel in a clean venv
        # Adopted from the very first version of this reusable workflow, not
        # discovered later through an audit: no build job here should ever be
        # able to pass without actually installing and running the real,
        # built package — this is exactly the gap that let a real,
        # ship-breaking bug (a wrong build-backend in pyproject.toml) go
        # undetected in the sibling loganalyzer repo's own history, found
        # only during a later audit, before any of this portfolio's CI had
        # this check at all.
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install "$(echo dist/*.whl)${{ inputs.package_extras }}"
          /tmp/smoke-venv/bin/${{ inputs.cli_command }} --version
          /tmp/smoke-venv/bin/${{ inputs.cli_command }} --help
