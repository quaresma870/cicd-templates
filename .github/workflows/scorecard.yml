# ──────────────────────────────────────────────────────────────────────────────
# OpenSSF Scorecard — for THIS repo (cicd-templates itself), not to be
# confused with the ossf/scorecard-action step already inside
# templates/nodejs/ci.yml and nodejs-ci-reusable.yml, which scans whatever
# repo *adopts* that template. This one scores cicd-templates' own supply
# chain security posture and publishes the badge in README.md.
# ──────────────────────────────────────────────────────────────────────────────

name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6"   # weekly, Saturday 01:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # to upload SARIF results to code scanning
      id-token: write          # to publish results and get a badge
      contents: read
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload results to code-scanning
        uses: github/codeql-action/upload-sarif@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          sarif_file: results.sarif
